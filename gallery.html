<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gallery | Green Focus Organization</title>

    <meta name="description" content="View photos from Green Focus Organization community events, reforestation, training, field work, and climate resilience activities.">

    <link rel="canonical" href="https://www.greenfocusorg.ug/gallery.html">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#064e3b">

    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="48x48" href="assets/images/favicon-48x48.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body data-page="gallery" class="bg-white text-gray-700 antialiased flex flex-col min-h-screen">

    <main class="page-transition">

        <header class="bg-emerald-900 py-20 text-center text-white">
            <div class="max-w-4xl mx-auto px-4">
                <h1 class="font-heading text-4xl md:text-5xl font-bold mb-4">
                    Gallery
                </h1>

                <p class="text-emerald-100">
                    Moments from community action, training, field work, reforestation, and events.
                </p>

                <div class="flex justify-center gap-2 text-sm mt-6">
                    <a href="index.html" class="hover:text-amber-400 transition">Home</a>
                    <span>/</span>
                    <span class="text-amber-400">Gallery</span>
                </div>
            </div>
        </header>

        <section class="py-20 bg-emerald-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

                <div id="gallery-filters" class="flex flex-wrap justify-center gap-3 mb-12"></div>

                <div id="gallery-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>

            </div>
        </section>

        <div id="gallery-lightbox"
             role="dialog"
             aria-modal="true"
             aria-label="Image preview"
             class="hidden fixed inset-0 bg-black/85 z-[100] flex items-center justify-center p-4">

            <div class="relative max-w-5xl w-full">
                <button id="lightbox-close"
                        class="absolute -top-12 right-0 text-white text-3xl hover:text-amber-500 transition"
                        aria-label="Close image preview">
                    <i class="fa-solid fa-xmark"></i>
                </button>

                <img id="lightbox-image"
                     src=""
                     alt="Gallery preview"
                     class="rounded-2xl shadow-2xl w-full max-h-[75vh] object-contain bg-white">

                <div class="text-center mt-4">
                    <h3 id="lightbox-title" class="text-white font-heading font-bold text-xl"></h3>
                    <p id="lightbox-caption" class="text-gray-200 text-sm mt-1"></p>
                </div>
            </div>
        </div>

    </main>

    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>

</body>
</html>
